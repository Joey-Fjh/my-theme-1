name: CI

on:
    push:
    pull_request:

permissions:
    contents: read
    checks: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build:tw
            - run: git diff --exit-code -- assets/tailwind.output.css
            - run: npm run lint
            - run: npm run test:validators
            - run: npm run doctor:agent

    theme-check:
        name: Theme Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Theme Check
              uses: shopify/theme-check-action@v2
              with:
                  token: ${{ github.token }}

    lighthouse:
        name: Lighthouse
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        concurrency:
            group: lighthouse-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v4

            - name: Lighthouse
              uses: shopify/lighthouse-ci-action@v1
              with:
                  store: ${{ secrets.SHOP_STORE }}
                  client_id: ${{ secrets.SHOP_CLIENT_ID }}
                  client_secret: ${{ secrets.SHOP_CLIENT_SECRET }}
                  password: ${{ secrets.SHOP_PASSWORD }}
                  collection_handle: collection1
                  lhci_min_score_performance: 0.6
                  lhci_min_score_accessibility: 0.9
