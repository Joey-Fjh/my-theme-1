name: CI

on:
    push:
    pull_request:

permissions:
    contents: read
    checks: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build:tw
            - run: git diff --exit-code -- assets/tailwind.output.css
            - run: npm run lint
            - run: npm run test:validators

    theme-check:
        name: Theme Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Theme Check
              uses: shopify/theme-check-action@v2
              with:
                  token: ${{ github.token }}
