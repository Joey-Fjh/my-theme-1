<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .row {
                display: flex;
                gap: 2px;
                padding: 20px;
            }
            .target {
                box-sizing: border-box;
                width: 20px;
                height: 20px;
                background: #333;
            }
        </style>
    </head>
    <body>
        <div class="row">
            <div role="button" tabindex="0" class="target" aria-label="A"></div>
            <div role="button" tabindex="0" class="target" aria-label="B"></div>
        </div>
    </body>
</html>
