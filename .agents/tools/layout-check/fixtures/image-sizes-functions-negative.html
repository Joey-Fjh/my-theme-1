<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .frame {
                width: 200px;
                height: 125px;
                overflow: hidden;
            }
            .frame img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="theme-image frame" data-image-mode="frame">
            <img
                class="image_img"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                width="400"
                height="250"
                sizes="(min-width: 1px) min(500px, 100vw), 100vw"
                alt=""
            />
        </div>
        <div class="theme-image frame" data-image-mode="frame">
            <img
                class="image_img"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                width="400"
                height="250"
                sizes="max(500px, 20vw)"
                alt=""
            />
        </div>
    </body>
</html>
