<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .frame {
                width: 400px;
                height: 250px;
                overflow: hidden;
            }
            .frame img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="theme-image frame" data-image-mode="frame" inert>
            <img
                class="image_img"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                width="400"
                height="250"
                sizes="80px"
                alt=""
            />
        </div>
    </body>
</html>
