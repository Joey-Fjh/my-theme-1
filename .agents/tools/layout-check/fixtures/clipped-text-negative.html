<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .box {
                width: 120px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div class="box">This text is much too long to fit in the box but line clamp handles it.</div>
    </body>
</html>
