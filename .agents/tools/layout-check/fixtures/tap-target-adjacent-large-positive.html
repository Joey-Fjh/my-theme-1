<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .row {
                display: flex;
                align-items: flex-start;
                padding: 24px;
            }
            .large {
                width: 48px;
                height: 48px;
                background: #333;
            }
            .small {
                box-sizing: border-box;
                width: 20px;
                height: 20px;
                margin-left: 0;
                background: #666;
            }
        </style>
    </head>
    <body>
        <div class="row">
            <div role="button" tabindex="0" class="large" aria-label="Large"></div>
            <div role="button" tabindex="0" class="small" aria-label="Small"></div>
        </div>
    </body>
</html>
