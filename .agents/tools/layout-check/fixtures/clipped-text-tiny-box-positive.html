<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            /* 1x1px and overflow hidden, but not clipped: not the sr-only shape, so it stays reportable. */
            .tiny {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <div class="tiny">Text squeezed into a one pixel box by mistake</div>
    </body>
</html>
