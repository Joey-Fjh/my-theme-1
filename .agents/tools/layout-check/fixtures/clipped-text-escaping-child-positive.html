<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            /* A static 1x1 box: `clip` has no effect, so its absolutely positioned child stays visible. */
            .static-clip {
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
            }
            /* A real sr-only box, but the text sits in a fixed child that escapes it. */
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
            }
            .escape {
                width: 60px;
                overflow: hidden;
                white-space: nowrap;
            }
            .escape--absolute {
                position: absolute;
                top: 20px;
                left: 20px;
            }
            .escape--fixed {
                position: fixed;
                top: 60px;
                left: 20px;
            }
        </style>
    </head>
    <body>
        <div class="static-clip"><div class="escape escape--absolute">Visible text that escapes a static clip box</div></div>
        <div class="sr-only"><div class="escape escape--fixed">Visible text in a fixed child of an sr-only box</div></div>
    </body>
</html>
