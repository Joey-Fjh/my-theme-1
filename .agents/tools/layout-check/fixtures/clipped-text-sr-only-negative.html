<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            /* Tailwind v4 sr-only */
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
                border-width: 0;
            }
            .legacy-clip {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }
            .inner {
                display: block;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <label class="sr-only" for="q">Search the whole store for products</label>
        <input id="q" />
        <h1 class="sr-only">A visually hidden page heading that is long</h1>
        <label class="sr-only"><span class="inner">A long label inside a nested child element</span></label>
        <span class="legacy-clip">Legacy clip rect visually hidden text</span>
    </body>
</html>
