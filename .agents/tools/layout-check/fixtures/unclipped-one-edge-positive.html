<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                margin: 0;
            }
            .clipper {
                position: relative;
                left: 0;
                width: 500px;
                height: 80px;
                overflow: hidden;
            }
            .wide {
                position: absolute;
                left: -40px;
                top: 0;
                width: 500px;
                height: 40px;
                background: #06c;
            }
        </style>
    </head>
    <body>
        <div class="clipper">
            <div class="wide"></div>
        </div>
    </body>
</html>
