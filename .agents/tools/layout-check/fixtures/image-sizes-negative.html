<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            .frame {
                width: 280px;
                height: 180px;
                overflow: hidden;
            }
            .frame img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="theme-image frame" data-image-mode="frame">
            <img
                class="image_img"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                width="900"
                height="600"
                loading="lazy"
                sizes="auto, 100vw"
                alt=""
            />
        </div>
    </body>
</html>
